name: CI
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
# Pushing again while a run is going makes that run pointless, so the new one replaces it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml's import grouping and merging are nightly-only options.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --check
  build:
    name: Clippy, tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install CMake and Ninja
        run: choco install cmake ninja -y
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # wxdragon-sys downloads wxWidgets and builds it with CMake into target/release, which takes
      # most of a cold build. rust-cache wipes everything in target/release except Cargo's own
      # directories before saving, so these get their own cache, keyed on the wxdragon-sys
      # version alone so that other dependency updates don't rebuild wxWidgets. It has to come
      # after rust-cache: post steps run in reverse, so this one saves before rust-cache cleans up.
      - name: Find the wxdragon-sys version
        id: wxdragon
        shell: bash
        run: echo "key=$(grep -A2 'name = "wxdragon-sys"' Cargo.lock | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache wxWidgets build
        uses: actions/cache@v6
        with:
          path: |
            target/release/wxWidgets
            target/release/wxwidgets_cmake_build
            target/release/wxdragon_sys_cmake_build
          key: wx-${{ runner.os }}-${{ steps.wxdragon.outputs.key }}
      # If the Rust cache hit but the wxWidgets one didn't, the restored fingerprint says
      # wxdragon-sys is built while its libraries are missing, and linking fails. Force it to
      # rebuild.
      - name: Rebuild wxdragon-sys if its CMake output is missing
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/wxwidgets_cmake_build/lib)) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue target/release/build/wxdragon-sys-*, target/release/.fingerprint/wxdragon-sys-*
          }
      # Everything runs in release, so wxWidgets and the dependencies are built once for clippy,
      # the tests, the build and the zip.
      - name: Run clippy
        run: cargo clippy --release --all-targets -- -D warnings
      # The tests use a local mock server, so they need no network or API key.
      - name: Run tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/elevendesk2 | Out-Null
          Copy-Item target/release/elevendesk2.exe, README.md, LICENSE dist/elevendesk2
          Compress-Archive -Path dist/elevendesk2 -DestinationPath dist/elevendesk2-x64.zip
      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          name: elevendesk2-x64
          path: dist/elevendesk2-x64.zip
          retention-days: 30
  release:
    name: Publish the release
    needs: [fmt, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with Cargo.toml would ship a build that reports the wrong version.
      - name: Check the tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Download the zip
        uses: actions/download-artifact@v8
        with:
          name: elevendesk2-x64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Windows build of ElevenDesk 2. Unzip it anywhere and run `elevendesk2.exe`; enter your ElevenLabs API key in Preferences on first launch.

          The executable is not code-signed, so Windows SmartScreen may warn you the first time you run it.
          NOTES
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/elevendesk2-x64.zip             --title "ElevenDesk 2 ${GITHUB_REF_NAME#v}"             --notes-file notes.md             --verify-tag             $flags
